<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Pitch Trainer</title>
<script src="Tone.js"></script>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1e33;
    --panel-2: #232849;
    --accent: #7c6cf0;
    --accent-2: #4fd1c5;
    --good: #45c97a;
    --bad: #e5554f;
    --text: #f3f3f8;
    --muted: #9aa0bd;
    --white-key: #f5f5fa;
    --white-key-dim: #3a3f5c;
    --black-key: #1a1a24;
    --black-key-dim: #12131c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #1c2140 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--panel);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid #2a2f52;
  }
  .stat .num {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent-2);
    line-height: 1.1;
  }
  .stat .label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }
  .panel {
    background: var(--panel);
    border-radius: 18px;
    padding: 18px;
    border: 1px solid #2a2f52;
    margin-bottom: 16px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-bottom: 4px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .control-group label.title {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .segmented {
    display: flex;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 7px 12px;
    font-size: 0.82rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 600;
  }
  .segmented button.active {
    background: var(--accent);
    color: white;
  }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3f5c;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .play-area {
    text-align: center;
    padding: 28px 0 20px;
  }
  #playBtn {
    background: linear-gradient(135deg, var(--accent), #5a4fd6);
    border: none;
    color: white;
    font-size: 1rem;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(124,108,240,0.35);
    transition: transform 0.1s;
  }
  #playBtn:active { transform: scale(0.97); }
  #playBtn:disabled { opacity: 0.5; cursor: default; }
  .feedback {
    min-height: 32px;
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    margin-top: 14px;
  }
  .feedback.correct { color: var(--good); }
  .feedback.wrong { color: var(--bad); }
  .note-count-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: -4px;
  }
  .keyboard {
    position: relative;
    display: flex;
    justify-content: center;
    padding: 10px 0 6px;
    user-select: none;
  }
  .keys-inner {
    position: relative;
    display: flex;
  }
  .white-key, .black-key {
    border: 1px solid #2a2f52;
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    padding-bottom: 6px;
  }
  .white-key {
    width: 40px;
    height: 140px;
    background: var(--white-key);
    color: #444;
    border-radius: 0 0 6px 6px;
    position: relative;
    z-index: 1;
  }
  .white-key.disabled {
    background: var(--white-key-dim);
    color: #6a6f8f;
    cursor: not-allowed;
  }
  .black-key {
    width: 26px;
    height: 88px;
    background: var(--black-key);
    color: #ccc;
    border-radius: 0 0 5px 5px;
    position: absolute;
    z-index: 2;
    top: 0;
  }
  .black-key.disabled {
    background: var(--black-key-dim);
    color: #555;
    cursor: not-allowed;
  }
  .white-key:active:not(.disabled), .black-key:active:not(.disabled) { transform: translateY(2px); }
  .white-key.correct-flash { background: var(--good) !important; color: white; }
  .white-key.wrong-flash { background: var(--bad) !important; color: white; }
  .black-key.correct-flash { background: var(--good) !important; color: white; }
  .black-key.wrong-flash { background: var(--bad) !important; color: white; }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 10px;
  }
  .reset-link {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 18px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Perfect Pitch Trainer</h1>
  <div class="subtitle">Listen, guess the note, build your ear.</div>

  <div class="stats-row">
    <div class="stat">
      <div class="num" id="streakNum">0</div>
      <div class="label">Current Streak</div>
    </div>
    <div class="stat">
      <div class="num" id="bestNum">0</div>
      <div class="label">Best Streak</div>
    </div>
    <div class="stat">
      <div class="num" id="dailyNum">0</div>
      <div class="label">Day Streak</div>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label class="title">Notes</label>
        <div class="segmented" id="keyModeGroup">
          <button data-val="all" class="active">All Keys</button>
          <button data-val="white">White Keys</button>
          <button data-val="black">Black Keys</button>
        </div>
      </div>
      <div class="control-group">
        <label class="title">Difficulty</label>
        <div class="segmented" id="noteCountGroup">
          <button data-val="1" class="active">1 Note</button>
          <button data-val="2">2 Notes</button>
          <button data-val="3">3 Notes</button>
        </div>
      </div>
      <div class="control-group">
        <label class="title">Sound</label>
        <div class="segmented" id="soundGroup">
          <button data-val="synth" class="active">Synth</button>
          <button data-val="piano">Piano</button>
        </div>
      </div>
      <div class="control-group">
        <label class="title">Octave</label>
        <select id="octaveSelect">
          <option value="3">Low (C3–B3)</option>
          <option value="4" selected>Mid (C4–B4)</option>
          <option value="5">High (C5–B5)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="panel play-area">
    <button id="playBtn">▶ Play Pitch</button>
    <div class="note-count-hint" id="progressHint"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="panel">
    <div class="keyboard" id="keyboard"></div>
    <div class="footer-note">Click the key(s) you heard, in any order.</div>
  </div>

  <div class="reset-link" id="resetStats">Reset all stats</div>
</div>

<script>
(function() {
  const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const WHITE_SET = new Set(["C","D","E","F","G","A","B"]);
  const BLACK_SET = new Set(["C#","D#","F#","G#","A#"]);

  // ---------- State ----------
  let state = {
    keyMode: "all",
    noteCount: 1,
    sound: "synth",
    octave: 4,
    targetNotes: [],   // array of note names for current round e.g. ["C","E"]
    guessedNotes: [],  // notes user has selected this round
    isPlaying: false,
    awaitingAnswer: false
  };

  // ---------- LocalStorage ----------
  const LS_KEY = "pitchTrainerStats_v1";
  function loadStats() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { currentStreak: 0, bestStreak: 0, dailyStreak: 0, lastPracticeDate: null, totalCorrect: 0, totalAttempts: 0 };
  }
  let stats = loadStats();
  function saveStats() {
    localStorage.setItem(LS_KEY, JSON.stringify(stats));
  }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function yesterdayStr() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function registerPracticeToday() {
    const today = todayStr();
    if (stats.lastPracticeDate === today) return; // already counted today
    if (stats.lastPracticeDate === yesterdayStr()) {
      stats.dailyStreak += 1;
    } else {
      stats.dailyStreak = 1;
    }
    stats.lastPracticeDate = today;
    saveStats();
  }
  function renderStats() {
    document.getElementById("streakNum").textContent = stats.currentStreak;
    document.getElementById("bestNum").textContent = stats.bestStreak;
    document.getElementById("dailyNum").textContent = stats.dailyStreak;
  }
  renderStats();

  document.getElementById("resetStats").addEventListener("click", () => {
    if (confirm("Reset all streaks and stats?")) {
      stats = { currentStreak: 0, bestStreak: 0, dailyStreak: 0, lastPracticeDate: null, totalCorrect: 0, totalAttempts: 0 };
      saveStats();
      renderStats();
    }
  });

  // ---------- Audio ----------
  let sampler = null;
  let samplerLoaded = false;
  function getSampler() {
    if (sampler) return sampler;
    sampler = new Tone.Sampler({
      urls: {
        C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", A4: "A4.mp3",
        C3: "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", A3: "A3.mp3",
        C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", A5: "A5.mp3",
        C6: "C6.mp3"
      },
      release: 1,
      baseUrl: "https://tonejs.github.io/audio/salamander/",
      onload: () => { samplerLoaded = true; }
    }).toDestination();
    return sampler;
  }
  let synth = null;
  function getSynth() {
    if (!synth) {
      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 0.02, decay: 0.2, sustain: 0.4, release: 0.8 }
      }).toDestination();
    }
    return synth;
  }

  async function playNotes(noteNames, octave) {
    await Tone.start();
    const freqs = noteNames.map(n => n + octave);
    if (state.sound === "piano") {
      const s = getSampler();
      const now = Tone.now();
      freqs.forEach((f, i) => s.triggerAttackRelease(f, "1.5", now + i * 0.05));
    } else {
      const s = getSynth();
      const now = Tone.now();
      freqs.forEach((f, i) => s.triggerAttackRelease(f, "1.5", now + i * 0.05));
    }
  }

  // ---------- Note pool ----------
  function getAvailableNotes() {
    if (state.keyMode === "white") return NOTE_NAMES.filter(n => WHITE_SET.has(n));
    if (state.keyMode === "black") return NOTE_NAMES.filter(n => BLACK_SET.has(n));
    return NOTE_NAMES.slice();
  }

  function pickTargetNotes() {
    const pool = getAvailableNotes();
    const count = Math.min(state.noteCount, pool.length);
    const shuffled = pool.slice().sort(() => Math.random() - 0.5);
    return shuffled.slice(0, count);
  }

  // ---------- Round flow ----------
  const playBtn = document.getElementById("playBtn");
  const feedbackEl = document.getElementById("feedback");
  const progressHint = document.getElementById("progressHint");

  function startNewRound() {
    state.targetNotes = pickTargetNotes();
    state.guessedNotes = [];
    state.awaitingAnswer = false;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    clearKeyFlashes();
    updateProgressHint();
    playBtn.textContent = "▶ Play Pitch";
    playBtn.disabled = false;
  }

  function updateProgressHint() {
    if (state.noteCount > 1) {
      progressHint.textContent = `Identify all ${state.noteCount} notes (${state.guessedNotes.length}/${state.noteCount} selected)`;
    } else {
      progressHint.textContent = "";
    }
  }

  function clearKeyFlashes() {
    document.querySelectorAll(".white-key, .black-key").forEach(k => {
      k.classList.remove("correct-flash", "wrong-flash");
    });
  }

  function handleGuess(noteName, keyEl) {
    if (!state.awaitingAnswer) return;
    if (state.guessedNotes.includes(noteName)) return;
    state.guessedNotes.push(noteName);

    const isCorrectNote = state.targetNotes.includes(noteName);
    keyEl.classList.add(isCorrectNote ? "correct-flash" : "wrong-flash");

    if (state.noteCount === 1) {
      finishRound(isCorrectNote);
      return;
    }

    updateProgressHint();

    if (!isCorrectNote) {
      finishRound(false);
      return;
    }

    if (state.guessedNotes.length === state.targetNotes.length) {
      const allCorrect = state.targetNotes.every(n => state.guessedNotes.includes(n));
      finishRound(allCorrect);
    }
  }

  function finishRound(correct) {
    state.awaitingAnswer = false;
    stats.totalAttempts += 1;
    registerPracticeToday();

    if (correct) {
      stats.currentStreak += 1;
      stats.totalCorrect += 1;
      if (stats.currentStreak > stats.bestStreak) stats.bestStreak = stats.currentStreak;
      feedbackEl.textContent = "✓ Correct!";
      feedbackEl.className = "feedback correct";
    } else {
      stats.currentStreak = 0;
      const answer = state.targetNotes.join(", ");
      feedbackEl.textContent = `✗ Not quite — it was ${answer}`;
      feedbackEl.className = "feedback wrong";
      // reveal remaining correct keys
      state.targetNotes.forEach(n => {
        const el = document.querySelector(`[data-note-key="${n}"]`);
        if (el) el.classList.add("correct-flash");
      });
    }
    saveStats();
    renderStats();
    playBtn.textContent = "Next ▶";
  }

  playBtn.addEventListener("click", async () => {
    if (!state.awaitingAnswer && playBtn.textContent.includes("Next")) {
      startNewRound();
      return;
    }
    playBtn.disabled = true;
    await playNotes(state.targetNotes, state.octave);
    state.awaitingAnswer = true;
    playBtn.disabled = false;
    playBtn.textContent = "🔁 Replay";
  });

  // ---------- Keyboard rendering ----------
  const keyboardEl = document.getElementById("keyboard");
  function renderKeyboard() {
    keyboardEl.innerHTML = "";
    const inner = document.createElement("div");
    inner.className = "keys-inner";
    const available = new Set(getAvailableNotes());

    const whiteNotes = NOTE_NAMES.filter(n => WHITE_SET.has(n));
    const whiteKeyWidth = 40;

    whiteNotes.forEach((n, i) => {
      const key = document.createElement("div");
      key.className = "white-key";
      key.dataset.noteKey = n;
      key.style.left = (i * whiteKeyWidth) + "px";
      key.textContent = n;
      if (!available.has(n)) key.classList.add("disabled");
      else key.addEventListener("click", () => handleGuess(n, key));
      inner.appendChild(key);
    });

    // black keys positioned relative to white keys
    const blackPositions = { "C#": 0, "D#": 1, "F#": 3, "G#": 4, "A#": 5 };
    Object.entries(blackPositions).forEach(([n, whiteIdx]) => {
      const key = document.createElement("div");
      key.className = "black-key";
      key.dataset.noteKey = n;
      key.style.left = (whiteIdx * whiteKeyWidth + whiteKeyWidth - 13) + "px";
      key.textContent = n;
      if (!available.has(n)) key.classList.add("disabled");
      else key.addEventListener("click", () => handleGuess(n, key));
      inner.appendChild(key);
    });

    inner.style.width = (whiteNotes.length * whiteKeyWidth) + "px";
    keyboardEl.appendChild(inner);
  }

  // ---------- Controls wiring ----------
  function wireSegmented(id, onChange) {
    const group = document.getElementById(id);
    group.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        onChange(btn.dataset.val);
      });
    });
  }

  wireSegmented("keyModeGroup", (val) => {
    state.keyMode = val;
    renderKeyboard();
    startNewRound();
  });
  wireSegmented("noteCountGroup", (val) => {
    state.noteCount = parseInt(val, 10);
    startNewRound();
  });
  wireSegmented("soundGroup", (val) => {
    state.sound = val;
  });
  document.getElementById("octaveSelect").addEventListener("change", (e) => {
    state.octave = parseInt(e.target.value, 10);
    startNewRound();
  });

  // ---------- Init ----------
  renderKeyboard();
  startNewRound();
})();
</script>
</body>
</html>
